services:
  quant_symbols:
    image: quant_symbols:latest
    container_name: quant_symbols
    stdin_open: true
    tty: true
    environment:
      DATABASE_URL: postgresql+psycopg://quant:quant_dev_password@localhost:5432/quant
      # Future Massive/Polygon client work. Keep real credentials out of git.
      MASSIVE_API_KEY:
      MASSIVE_BASE_URL: https://api.polygon.io
      MASSIVE_TIMEOUT_SECONDS: 30
      MASSIVE_RETRY_COUNT: 3
      MASSIVE_BACKOFF_SECONDS: 0.5
      MASSIVE_BACKOFF_MULTIPLIER: 2
      # Set to HH:MM for a daily fixed-time sync in the container's local time.
      # Leave empty to use SYNC_INTERVAL instead.
      SYNC_TIME:
      SYNC_INTERVAL: 86400
