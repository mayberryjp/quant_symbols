[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-symbols"
version = "0.1.0"
description = "Symbol master and reference-data persistence for quant trading pipelines."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "SQLAlchemy>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["quant_symbols*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
