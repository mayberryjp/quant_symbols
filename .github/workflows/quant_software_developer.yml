name: Quant Software Developer Agent

on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  quant-software-developer:
    if: github.event.label.name == 'quant_software_developer'
    runs-on: [self-hosted, quant_software_developer]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Make Node 20 visible to sudo and runner user
        run: |
          sudo ln -sf /opt/hostedtoolcache/node/20.20.2/x64/bin/node /usr/local/bin/node
          sudo ln -sf /opt/hostedtoolcache/node/20.20.2/x64/bin/npm /usr/local/bin/npm
          sudo ln -sf /opt/hostedtoolcache/node/20.20.2/x64/bin/npx /usr/local/bin/npx
          hash -r
          sudo -u runner -- node -v

      - name: Prepare clean Codex home and temp agent folder
        run: |
          rm -rf "$RUNNER_TEMP/codex-home"
          mkdir -p "$RUNNER_TEMP/codex-home"
          chown -R runner:runner "$RUNNER_TEMP/codex-home"

          rm -rf "$RUNNER_TEMP/agent"
          mkdir -p "$RUNNER_TEMP/agent"

          rm -f /home/runner/.codex/config.toml || true
          mkdir -p /home/runner/.codex
          chown -R runner:runner /home/runner/.codex

      - name: Build full issue context for Codex
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          PROMPT_FILE="$RUNNER_TEMP/agent/issue-${ISSUE_NUMBER}-quant-software-developer.md"

          cat > "$PROMPT_FILE" <<'EOF'
          You are working in the mayberryjp/dockercompose repository.

          You are the Quant Software Developer agent.

          Your responsibility:
          - Design and implement Python code for acquiring symbol/security/reference information from Massive/Polygon.
          - Focus on maintainable Python modules, clients, config handling, retry/error handling, pagination, rate-limit awareness, typing, tests, and useful CLI or service entrypoints when appropriate.
          - Do not hard-code API keys or secrets.
          - Use environment variables or existing repo config patterns for credentials.
          - If the issue involves PostgreSQL persistence, coordinate through clean interfaces and document the expected database contract, but avoid major schema work unless the issue clearly asks for it.
          - If the issue involves Docker/container execution, make the smallest needed integration change and document it.

          Important:
          - You must inspect the repository and make source/config/documentation changes unless the requested work is already implemented.
          - Do not only summarize the issue.
          - Do not stop after analysis.
          - If no change is needed, explain exactly which existing files already implement the behavior.
          - Make the smallest reasonable change.
          - Do not edit unrelated files.
          - Do not change secrets, credentials, workflow permissions, runner config, or GitHub Actions unless the issue explicitly asks for workflow changes.
          - Run relevant tests or validation if available.
          - Leave the repo in a commit-ready state.

          Documentation requirement:
          - Document software design, configuration, and code changes in the repo.
          - Prefer an existing docs location if one exists.
          - If no suitable docs location exists, create or update docs/codex/quant-software-developer.md.
          - Documentation must be based only on verified repository changes. Do not invent behavior.

          Required final artifact:
          - Before finishing, create or update .agent/change-summaries/issue-${{ github.event.issue.number }}-quant-software-developer.md.
          - This file will be consumed by later documentation/release agents.
          - The file is required even if no code changes were made.
          - Use exactly this format:

          ## Agent Change Summary

          ### Agent
          - Quant Software Developer

          ### GitHub issue
          - #${{ github.event.issue.number }}

          ### What changed
          - ...

          ### Software design impact
          - ...

          ### Massive / Polygon integration impact
          - ...

          ### Configuration impact
          - ...

          ### Code impact
          - ...

          ### Files changed
          - ...

          ### Documentation impact
          - ...

          ### Testing / validation
          - ...

          ### Open questions
          - ...

          Definition of done:
          - The requested Python/software work is implemented or clearly proven already implemented.
          - Relevant validation passes, or you document why it could not be run.
          - Documentation exists for the design/config/code changes.
          - .agent/change-summaries/issue-${{ github.event.issue.number }}-quant-software-developer.md exists and follows the required format.
          - The change is ready for human review.

          Full GitHub issue context follows.

          EOF

          gh issue view "$ISSUE_NUMBER" \
            --repo "$REPO" \
            --json number,title,body,author,comments,labels,url \
            --jq '
              "# GitHub Issue #" + (.number|tostring) + "\n\n" +
              "URL: " + .url + "\n\n" +
              "Title: " + .title + "\n\n" +
              "Labels: " + ([.labels[].name] | join(", ")) + "\n\n" +
              "Author: @" + .author.login + "\n\n" +
              "## Original Issue Body\n\n" +
              (.body // "") + "\n\n" +
              "## Issue Comments / Conversation\n\n" +
              (
                if (.comments | length) == 0 then
                  "_No comments yet._\n"
                else
                  (
                    .comments
                    | sort_by(.createdAt)
                    | map(
                        "### Comment by @" + .author.login + " at " + .createdAt + "\n\n" +
                        (.body // "") + "\n"
                      )
                    | join("\n---\n\n")
                  )
                end
              )
            ' >> "$PROMPT_FILE"

          echo "Built full issue context:"
          sed -n '1,260p' "$PROMPT_FILE"

      - name: Verify OpenAI API key secret
        env:
          OPENAI_API_KEY_CHECK: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY_CHECK" ]; then
            echo "OPENAI_API_KEY is empty or unavailable"
            exit 1
          fi

          echo "OPENAI_API_KEY is present"
          echo "Length: ${#OPENAI_API_KEY_CHECK}"
          echo "Prefix: $(printf '%s' "$OPENAI_API_KEY_CHECK" | cut -c1-7)"

      - name: Run Codex software developer
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/agent/issue-${{ github.event.issue.number }}-quant-software-developer.md
          output-file: ${{ runner.temp }}/agent/codex-output-${{ github.event.issue.number }}-quant-software-developer.md
          codex-home: ${{ runner.temp }}/codex-home
          safety-strategy: unsafe
          codex-user: runner
          sandbox: danger-full-access

      - name: Verify agent change summary
        if: always()
        run: |
          mkdir -p .agent/change-summaries

          SUMMARY_FILE=".agent/change-summaries/issue-${{ github.event.issue.number }}-quant-software-developer.md"

          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "Codex did not create $SUMMARY_FILE. Creating fallback summary."

            {
              echo "## Agent Change Summary"
              echo
              echo "### Agent"
              echo "- Quant Software Developer"
              echo
              echo "### GitHub issue"
              echo "- #${{ github.event.issue.number }}"
              echo
              echo "### What changed"
              echo "- No structured change summary was produced by the software developer agent."
              echo
              echo "### Software design impact"
              echo "- Unknown. Review the PR diff."
              echo
              echo "### Massive / Polygon integration impact"
              echo "- Unknown. Review the PR diff."
              echo
              echo "### Configuration impact"
              echo "- Unknown. Review the PR diff."
              echo
              echo "### Code impact"
              echo "- Unknown. Review the PR diff."
              echo
              echo "### Files changed"
              echo "- Unknown. Review the PR diff."
              echo
              echo "### Documentation impact"
              echo "- Unknown. A human reviewer should inspect the changes."
              echo
              echo "### Testing / validation"
              echo "- Unknown. Review Codex output and workflow logs."
              echo
              echo "### Open questions"
              echo "- The software developer agent did not create the required summary file."
            } > "$SUMMARY_FILE"
          fi

          echo "=== Agent change summary ==="
          cat "$SUMMARY_FILE"

      - name: Show Codex output
        if: always()
        run: |
          echo "=== Codex output ==="

          OUTPUT_FILE="$RUNNER_TEMP/agent/codex-output-${{ github.event.issue.number }}-quant-software-developer.md"

          if [ -f "$OUTPUT_FILE" ]; then
            cat "$OUTPUT_FILE"
          else
            echo "No Codex output found"
          fi

          echo
          echo "=== Git status ==="
          git status --short

          echo
          echo "=== Git diff summary ==="
          git diff --stat || true

      - name: Block sensitive file changes
        run: |
          CHANGED="$(git diff --name-only)"

          if echo "$CHANGED" | grep -E '(^\.env|\.pem$|\.key$|secrets|credentials)' ; then
            echo "Refusing PR because sensitive files were changed."
            exit 1
          fi

      - name: Run basic validation
        run: |
          set -e

          if [ -f package.json ]; then
            echo "Detected package.json"
            npm install
            npm test --if-present
          fi

          if [ -f pyproject.toml ] || [ -f requirements.txt ]; then
            echo "Detected Python project"
            python3 -m compileall .
          fi

          if find . -type f -name 'test_*.py' | grep -q .; then
            echo "Detected Python tests"
            python3 -m pytest || true
          fi

      - name: Create branch and PR if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes made by agent."
            exit 0
          fi

          BRANCH="quant-software-developer/issue-${{ github.event.issue.number }}-${{ github.run_id }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"

          git add -A \
            ':!.agent/issue.md' \
            ':!.agent/codex-output.md' \
            ':!.agent/pr-body.md'

          if git diff --cached --quiet; then
            echo "Only ignored/generated files changed. No PR needed."
            exit 0
          fi

          git commit -m "Quant software developer work for issue #${{ github.event.issue.number }}"
          git push origin "$BRANCH"

          SUMMARY_FILE=".agent/change-summaries/issue-${{ github.event.issue.number }}-quant-software-developer.md"
          OUTPUT_FILE="$RUNNER_TEMP/agent/codex-output-${{ github.event.issue.number }}-quant-software-developer.md"
          PR_BODY="$RUNNER_TEMP/agent/pr-body-${{ github.event.issue.number }}-quant-software-developer.md"

          {
            echo "## Codex Output"
            echo

            if [ -f "$OUTPUT_FILE" ]; then
              cat "$OUTPUT_FILE"
            else
              echo "No Codex output file was produced."
            fi

            echo
            echo "---"
            echo
            echo "## Agent Change Summary"
            echo

            if [ -f "$SUMMARY_FILE" ]; then
              cat "$SUMMARY_FILE"
            else
              echo "No agent change summary was produced."
            fi
          } > "$PR_BODY"

          gh pr create \
            --title "Quant software developer work for issue #${{ github.event.issue.number }}" \
            --body-file "$PR_BODY" \
            --base main \
            --head "$BRANCH"
